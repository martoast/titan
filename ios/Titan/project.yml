# XcodeGen spec — generates Titan.xcodeproj with everything wired (sources, TitanCore package,
# Info.plist, background-BLE, signing). Run:  cd ios/Titan && xcodegen
#
# Minimal for the make-or-break test: bluetooth-central background mode works on a real device
# with a FREE Apple ID (Personal Team) — no paid account needed yet. Push/HealthKit (which need
# the paid program) are added later by enabling those capabilities in Xcode.
name: Titan
options:
  bundleIdPrefix: com.titan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en   # source language; es-MX comes from Localizable.xcstrings + CFBundleLocalizations

packages:
  TitanCore:
    path: ../TitanCore

targets:
  Titan:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: TitanCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Titan
        # Localizations the app ships (in-app switchable, independent of device language via
        # LanguageManager). Spanish is Mexican (es-MX) — the strings live in Localizable.xcstrings.
        CFBundleLocalizations:
          - en
          - es-MX
        # Version = single source of truth (the build settings below). Bump CURRENT_PROJECT_VERSION
        # for each TestFlight upload; MARKETING_VERSION is the user-facing App Store version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: Titan uses ONLY standard HTTPS/TLS + HMAC-SHA256 (device signing) — both
        # are exempt encryption. Declaring this here skips the manual encryption question on EVERY
        # TestFlight/App Store upload. (If you ever add non-standard/proprietary crypto, revisit this.)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "Titan connects to your recovery band and an optional heart-rate chest strap to sync your biosignals in the background."
        NSLocationWhenInUseUsageDescription: "Titan uses your location during a run to map your route and measure distance and pace. The band has no GPS, so your phone does it."
        NSMicrophoneUsageDescription: "Titan uses your microphone so you can dictate messages to your coach by voice."
        NSCameraUsageDescription: "Titan uses your camera to snap meals for instant macros and to capture progress photos."
        NSPhotoLibraryUsageDescription: "Titan lets you choose meal and progress photos from your library."
        NSHealthShareUsageDescription: "Titan reads your steps, sleep, heart rate and workouts to compute your recovery, insights and trends — no wearable required."
        NSHealthUpdateUsageDescription: "Titan does not write to Apple Health; it only reads your data to power your coaching."
        NSMotionUsageDescription: "Titan uses motion data to count your steps, distance and flights climbed — live, with no wearable."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Titan.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []   # background-delivery omitted (needs the paid program)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmartos.titan
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1"            # iPhone
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Sources/Assets.xcassets/AppIcon.appiconset
        # Automatic signing — DEVELOPMENT_TEAM is your 10-char Team ID (Apple Development cert OU).
        # A free personal Apple ID team works for on-device dev builds (7-day provisioning).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AM886483DX

# A shared scheme so `xcodebuild`/Xcode Organizer archive consistently (Release), and CI/fastlane
# can build it later. Debug for run/test, Release for profile/archive/analyze.
schemes:
  Titan:
    build:
      targets:
        Titan: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
