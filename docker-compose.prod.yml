# Titan — self-hosted production stack.
#
#   cp .env.production.example .env   # then fill in the REQUIRED secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything the app needs runs here: the Laravel web app (blue/green slots), a queue
# worker, the scheduler, the Python biosignal service, MySQL, Redis, and MinIO (raw
# waveform blobs). Ingress (proxy/TLS) is handled outside this stack — on this server,
# Cloudflare Tunnel → host Caddy :3010 → blue/green. The wearable/bridge POSTs signed
# batches to https://<your-domain>.
name: titan

x-app: &app
  image: titan/app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  restart: unless-stopped
  # `ideasandbugs` reaches the failure hub at ib-hub. Every PHP role inherits
  # this anchor, and only PHP roles report anything.
  networks: [titan, ideasandbugs]

services:
  # ── Laravel web app — blue/green slots for zero-downtime deploys ─────────────
  # A host proxy (Caddy) on :3010 balances between 127.0.0.1:3110 (blue) and
  # 127.0.0.1:3120 (green). The deploy script starts the new color, waits for
  # healthy, then stops the old one. Exactly one color runs outside of deploys.
  app-blue:
    <<: *app
    profiles: [blue]
    ports: ["127.0.0.1:3110:8080"]
    environment:
      AUTORUN_LARAVEL_MIGRATION: "true"   # whichever color boots runs migrations
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  app-green:
    <<: *app
    profiles: [green]
    ports: ["127.0.0.1:3120:8080"]
    environment:
      AUTORUN_LARAVEL_MIGRATION: "true"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ── Queue worker: ProcessWindowJob (biosignal queue), SealNightJob, coach jobs ─
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=biosignal,default", "--sleep=1", "--tries=3", "--max-time=3600"]
    # Each worker processes one window at a time; with 1, a night's ~30 windows seal
    # serially (~80s). Run several so windows fan out across the biosignal workers and the
    # sleep summary stages in seconds. Match QUEUE_WORKERS to UVICORN_WORKERS in .env.
    # Default 1 = current behaviour (no surprise CPU/RAM jump on an unsized box).
    deploy:
      replicas: ${QUEUE_WORKERS:-1}
    healthcheck:  # the image default curls nginx, which workers don't run
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ── Scheduler: nightly seals, briefings, nudges (routes/console.php) ─────────
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ── Python biosignal service (internal only; HRV / sleep / activity / VO2max) ─
  biosignal:
    image: titan/biosignal
    build:
      context: ./biosignal
    restart: unless-stopped
    environment:
      BIOSIGNAL_TOKEN: ${BIOSIGNAL_TOKEN}
      # Concurrent DSP workers. Sealing a night fans out ~30 per-window HRV calls; with 1
      # worker they serialise (~80s). Set to ~(cores-1) so windows process in parallel and
      # the sleep summary's stages land in seconds. Each worker loads the models (~300MB),
      # so size to RAM too — pair with QUEUE_WORKERS in .env. Default 1 = current behaviour.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    networks: [titan]

  # ── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-titan}
      MYSQL_USER: ${DB_USERNAME:-titan}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes: [titan-mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [titan]

  # ── Redis (queue + cache) ─────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [titan-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [titan]

  # ── MinIO — S3-compatible store for raw biosignal blobs (the `raw` disk) ──────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":8900"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: [titan-minio:/data]
    networks: [titan]

  # ── One-shot: create the raw bucket, then exit ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_started}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-titan-raw}
    entrypoint: ["sh", "-c", "until mc alias set t http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\"; do echo waiting-for-minio; sleep 2; done; mc mb -p \"t/$$MINIO_BUCKET\" || true; echo titan-raw-bucket-ready"]
    restart: "no"
    networks: [titan]

networks:
  # Reach the Ideas + Bugs hub by its alias, ib-hub.
  ideasandbugs:
    external: true
    name: ideasandbugs_ib
  titan:

volumes:
  titan-mysql:
  titan-redis:
  titan-minio:
