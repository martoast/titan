[project]
name = "titan-biosignal"
version = "0.1.0"
description = "Titan Wearable biosignal microservice — PPG/IBI/accel → HRV, sleep, activity metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "neurokit2>=0.2.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
